version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq-duoc
    ports:
      - "5680:5672"   
      - "15680:15672"
    networks:
      - red-duoc


  usuarios-service:
    build: .
    container_name: ms-usuarios
    ports:
      - "8080:8080" 
    environment:
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=guest
      - SPRING_RABBITMQ_PASSWORD=guest
    depends_on:
      - rabbitmq 
    networks:
      - red-duoc

networks:
  red-duoc:
    name: red-proyecto-duoc
    external: true